# Adds pods when average CPU goes above 70% of the request. Needs metrics-server
# (minikube: `minikube addons enable metrics-server`; AKS has it by default).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devopsappcicd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devopsappcicd
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
