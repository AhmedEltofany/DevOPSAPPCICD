# Dev: one small replica, image built locally (minikube / kind / Docker Desktop).
#   kubectl apply -k k8s/overlays/dev
#   kubectl -n devopsappcicd-dev port-forward svc/devopsappcicd 8080:80
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devopsappcicd-dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: devopsappcicd
    newTag: local

configMapGenerator:
  - name: devopsappcicd-config
    behavior: merge
    literals:
      - APP_ENV=dev

patches:
  - target:
      kind: Deployment
      name: devopsappcicd
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: devopsappcicd
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
